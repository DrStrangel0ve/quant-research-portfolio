[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-research-portfolio"
version = "0.1.0"
description = "Reproducible quantitative finance research, simulation, and backtesting projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quant Portfolio Contributors" }]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pandas-stubs>=2.1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]
poker = [
  "rlcard==1.2.0",
  "setuptools>=68,<81",
]
neural-poker = [
  "torch>=2.4,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=quantlab --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["quantlab"]

[[tool.mypy.overrides]]
module = ["rlcard.*", "scipy.*", "torch.*"]
ignore_missing_imports = true
